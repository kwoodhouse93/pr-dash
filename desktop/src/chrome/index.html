<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self'; script-src 'self'" />
    <title>PR Dash</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar" hidden aria-label="Tabs and agents">
      <div class="side-head">
        <button id="hide-sidebar" class="icon" title="Hide sidebar (⌃⌘S)" aria-label="Hide sidebar"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2" /><path d="M6 3v10" /></svg></button>
      </div>
      <div class="side-body">
        <div class="row home" id="home" role="tab"><span class="title">Pull requests</span><span class="num">⌘1</span></div>
        <section id="agents-section" hidden>
          <div class="sec"><span>Agents</span><span class="sec-note" id="agents-note"></span><button id="agents-clear" class="link" hidden title="Mark every finished agent as read">Clear</button></div>
          <div id="agents"></div>
        </section>
        <div class="sec"><span>Tabs</span><button id="grouping" class="pick" title="Group open pull requests"></button></div>
        <div id="nodes" role="tablist"></div>
      </div>
      <div class="side-foot">
        <div class="row" id="queue-link" role="tab"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h6" /></svg><span class="title">Merge queue</span></div>
        <div class="row" id="settings-link" role="tab"><svg viewBox="0 0 16 16"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6" /><circle cx="10" cy="5" r="1.5" /><circle cx="6" cy="11" r="1.5" /></svg><span class="title">Settings</span></div>
      </div>
      <div class="resize" id="resize" title="Drag to resize. Double-click to reset."></div>
    </aside>
    <div class="strip">
      <button id="show-sidebar" class="icon" title="Show sidebar (⌃⌘S)" aria-label="Show sidebar"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2" /><path d="M6 3v10" /></svg></button>
      <div class="nav">
        <button id="back" class="icon" title="Back (⌘[)" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg></button>
        <button id="forward" class="icon" title="Forward (⌘])" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg></button>
        <button id="reload" class="icon" title="Reload (⌘R)" aria-label="Reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" /><path d="M13 2.5v3h-3" /></svg></button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="crumb" id="crumb" hidden></div>
      <div class="actions">
        <button id="update" class="pill" hidden title="Restart the dashboard on the latest build">Update</button>
        <button id="agents-pill" class="agents-pill" hidden aria-haspopup="true" aria-expanded="false"></button>
        <button id="external" class="icon" title="Open in browser (⇧⌘O)" aria-label="Open in browser"><svg viewBox="0 0 16 16"><path d="M6.5 3.5H3.8a1.3 1.3 0 0 0-1.3 1.3v7.4a1.3 1.3 0 0 0 1.3 1.3h7.4a1.3 1.3 0 0 0 1.3-1.3V9.5" /><path d="M9 2.5h4.5V7" /><path d="M13.5 2.5 7.5 8.5" /></svg></button>
      </div>
    </div>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="pop" id="pop" hidden role="menu" aria-label="Agents">
      <div class="sec"><span>Agents</span><span class="sec-note" id="pop-note"></span><button id="pop-clear" class="link" hidden title="Mark every finished agent as read">Clear</button></div>
      <div id="pop-agents"></div>
    </div>
    <script src="./chrome.js"></script>
  </body>
</html>
