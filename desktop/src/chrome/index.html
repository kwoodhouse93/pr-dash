<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self'; script-src 'self'" />
    <title>PR Dash</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="strip">
      <div class="nav">
        <button id="back" title="Back (⌘[)" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg></button>
        <button id="forward" title="Forward (⌘])" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg></button>
        <button id="reload" title="Reload (⌘R)" aria-label="Reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" /><path d="M13 2.5v3h-3" /></svg></button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="actions">
        <button id="update" class="pill" hidden title="Restart the dashboard on the latest build">Update</button>
        <button id="external" title="Open in browser (⇧⌘O)" aria-label="Open in browser"><svg viewBox="0 0 16 16"><path d="M6.5 3.5H3.8a1.3 1.3 0 0 0-1.3 1.3v7.4a1.3 1.3 0 0 0 1.3 1.3h7.4a1.3 1.3 0 0 0 1.3-1.3V9.5" /><path d="M9 2.5h4.5V7" /><path d="M13.5 2.5 7.5 8.5" /></svg></button>
      </div>
    </div>
    <script src="./chrome.js"></script>
  </body>
</html>
